name = "telegram-mcp-worker"
main = "src/worker.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Secrets (never commit real values):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put MCP_AUTH_TOKEN        # optional bearer auth for /mcp
# Optional plain vars can go here or in the dashboard, e.g.:
# [vars]
# TELEGRAM_META_MODE = "true"

[vars]
TELEGRAM_DEFAULT_CHAT_ID = "801062947"

# Temporary file storage for download_file / get_message_file.
# Create the bucket once:  wrangler r2 bucket create telegram-mcp-files
# Purge leftovers daily:   wrangler r2 bucket lifecycle add telegram-mcp-files expire-tmp tmp/ --expire-days 1
[[r2_buckets]]
binding = "FILES"
bucket_name = "telegram-mcp-files"
