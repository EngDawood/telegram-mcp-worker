name = "telegram-mcp-worker"
main = "src/worker.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Secrets (never commit real values):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put MCP_AUTH_TOKEN        # optional bearer auth for /mcp
# Optional plain vars can go here or in the dashboard, e.g.:
# [vars]
# TELEGRAM_META_MODE = "true"
